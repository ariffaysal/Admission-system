services:
  db:
    image: postgres:16-alpine
    container_name: admission-db
    environment:
      POSTGRES_DB: admission_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: AdmissionSystem.Api/Dockerfile
    container_name: admission-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=Host=db;Database=admission_db;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admission-web
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:
